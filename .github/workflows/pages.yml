name: Test, refresh and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6,14,22 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      refresh_outcome: ${{ steps.refresh.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for crest thumbnails
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run tests
        run: npm test
      - name: Refresh public Draft data
        id: refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run update-data
      - name: Save refreshed standings
        if: steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history/ data/players.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh PRE FTW standings"
            git push
          fi
      - name: Build static site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report incomplete refresh
        if: needs.build.outputs.refresh_outcome == 'failure'
        run: |
          echo "A configured league could not refresh. The site retains its previous data; inspect the refresh logs."
          exit 1
