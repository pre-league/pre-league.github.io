<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="description" data-i18n="content" content="Four divisions. One community. Follow the PRE FTW FPL Draft leagues, standings, squads and weekly points.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://resources.premierleague.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>PRE FTW League · FPL Draft</title>
  <link rel="icon" type="image/webp" href="./assets/crest.webp">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n>Skip to content</a>
  <header id="topbar" class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="#page=home" aria-label="PRE FTW home" data-i18n="aria-label"><img src="./assets/crest.webp" width="32" height="36" alt=""><span>PRE<span class="accent">FTW</span></span></a>
      <button id="search-toggle" class="search-toggle" type="button" aria-label="Search clubs" aria-controls="search" aria-expanded="false" data-i18n="aria-label"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 5 5"></path></svg></button>
      <label class="search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 5 5"></path></svg><input id="search" type="search" placeholder="Find a club" autocomplete="off" aria-label="Search teams and managers" data-i18n="placeholder aria-label"></label>
      <button id="search-cancel" class="search-cancel" type="button" data-i18n>Cancel</button>
      <label class="design-picker"><span data-i18n>Design</span>
        <select id="design">
          <option value="fotmob" data-theme-color="#101010">FotMob</option>
          <option value="fantasy" data-theme-color="#37003c">Fantasy</option>
          <option value="flashscore" data-theme-color="#001e28">Flashscore</option>
        </select>
      </label>
      <button id="language-toggle" class="language-toggle" type="button" aria-label="Switch to Portuguese (Portugal)" hidden><img id="language-flag" src="./assets/flag-gb.svg" width="20" height="14" alt=""><span id="language-indicator" aria-hidden="true">EN</span></button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="Competition navigation" data-i18n="aria-label">
      <nav id="pages" class="pages-nav" aria-label="Main navigation" data-i18n="aria-label"></nav>
      <div class="sidebar-label divisions-label"><strong data-i18n>Divisions</strong></div>
      <nav id="divisions" class="division-nav" aria-label="Divisions" data-i18n="aria-label"></nav>
      <a class="sidebar-source" href="https://draft.premierleague.com/" target="_blank" rel="noopener noreferrer"><span data-i18n>Official FPL Draft</span> <span aria-hidden="true">↗</span></a>
    </aside>
    <main id="main" tabindex="-1">
      <div id="app" aria-busy="true"><div class="loading" role="status"><div class="loading-line"></div><span data-i18n>Loading the league…</span></div></div>
    </main>
  </div>
  <footer class="footer"><span data-i18n>Independent community tracker · Not affiliated with the Premier League or FotMob.</span></footer>
  <noscript><p class="noscript">Enable JavaScript to view standings and teams.</p></noscript>
</body>
</html>
